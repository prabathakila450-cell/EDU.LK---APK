name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env || touch .env
          fi

      - name: Recreate debug.keystore from base64 if needed
        run: |
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: steps.find_apk.outputs.apk_path != ''
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Edu.LK App Release v1.0.0 (Build ${{ github.run_number }})"
          body: |
            ### 🚀 Edu.LK Android App Official APK Download
            
            - **Status**: Ready to install on Android devices
            - **Build Date**: ${{ github.event.head_commit.timestamp || 'Latest' }}
            
            #### 📱 How to Install:
            1. Download the `app-debug.apk` file below under **Assets**.
            2. Open the file on your Android phone.
            3. Tap **Install** (Allow installation from unknown sources if prompted).
          draft: false
          prerelease: false
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
